<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            position: relative;
            overflow: hidden;
        }
        
        .error-code {
            font-family: var(--font-secondary);
            font-size: 15rem;
            font-weight: 800;
            line-height: 1;
            color: rgba(255, 255, 255, 0.05);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
        
        .error-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: var(--white);
        }
        
        /* Simple particle animation */
        .particle {
            position: absolute;
            background-color: var(--secondary-color);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-1000px) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="error-page">
        <!-- Animated Particles -->
        <div id="particles"></div>
        
        <div class="container error-content text-center d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="mb-5 position-relative">
                <h1 class="fw-bold mb-0" style="font-size: 14vw; min-font-size: 8rem; background: linear-gradient(135deg, var(--secondary-color) 0%, #ffffff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: var(--font-secondary); line-height: 1; filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.4));">404</h1>
                <h2 class="display-4 fw-bold text-white mt-2 mb-4" style="letter-spacing: 2px;">PAGE NOT FOUND</h2>
                <p class="lead text-light mb-5 mx-auto" style="max-width: 500px;">The page you're looking for may have moved, been deleted, or never existed.</p>
                
                <div class="d-flex justify-content-center gap-3 flex-wrap mt-2">
                    <a href="index.html" class="btn-primary-stackly px-4 py-3 rounded-pill fw-bold">Back to Home <i class="bi bi-house ms-2"></i></a>
                    <a href="javascript:history.back()" class="btn-outline-stackly border-secondary text-secondary px-4 py-3 rounded-pill fw-bold">Go Back</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate particles
        document.addEventListener('DOMContentLoaded', () => {
            const particlesContainer = document.getElementById('particles');
            for(let i=0; i<20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random properties
                const size = Math.random() * 10 + 2 + 'px';
                particle.style.width = size;
                particle.style.height = size;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.bottom = '-20px';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 5) + 's';
                
                particlesContainer.appendChild(particle);
            }
        });
    </script>
</body>
</html>
