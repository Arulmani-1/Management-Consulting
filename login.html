<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Stackly</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <!-- Preloader -->
    <div id="preloader" class="preloader">
        <div class="preloader-content">
            <img src="assets/images/logo.webp" alt="Stackly Logo" class="preloader-logo">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="split-screen flex-column flex-lg-row">
        <!-- Left: Image -->
        <div class="split-left split-bg d-none d-lg-flex position-relative" style="background-image: url('assets/images/consulting.webp');">
            <a href="index.html" class="position-absolute top-0 start-50 translate-middle-x mt-5 z-3 text-decoration-none">
                <img src="assets/images/logo.webp" alt="Stackly Logo" style="height: 50px;">
            </a>
            <div class="position-relative z-2 text-white p-5 d-flex flex-column h-100 justify-content-end">
                <div>
                    <h2 class="display-5 fw-bold mb-4 text-white" style="color: white !important;">Your Next Business Opportunity Awaits.</h2>
                    <p class="lead text-light">Access your dashboard to track progress, download reports, and connect with your dedicated consulting team.</p>
                </div>
            </div>
        </div>
        
        <!-- Right: Form -->
        <div class="split-right bg-white px-4 py-5 px-sm-5 d-flex flex-column align-items-center justify-content-center">
            <div class="w-100" style="max-width: 450px;">
                <div class="d-lg-none mb-4 text-center">
                    <a href="index.html" class="text-decoration-none"><img src="assets/images/logo.webp" alt="Stackly Logo" style="height: 50px;"></a>
                </div>
                
                <h2 class="fw-bold mb-1">Welcome Back</h2>
                <p class="text-secondary mb-4">Please enter your details to sign in.</p>
                
                <div class="d-flex bg-light p-1 rounded-pill mb-4 role-toggle" style="border: 1px solid #e5e7eb;">
                    <input type="radio" class="btn-check" name="role" id="roleClient" autocomplete="off" checked>
                    <label class="btn w-50 rounded-pill fw-bold" for="roleClient">Client</label>

                    <input type="radio" class="btn-check" name="role" id="roleAdmin" autocomplete="off">
                    <label class="btn w-50 rounded-pill fw-bold" for="roleAdmin">Admin</label>
                </div>
                
                <form class="needs-validation" novalidate id="loginForm" onsubmit="event.preventDefault(); const email = this.querySelector('input[type=\'email\']').value; if(email !== localStorage.getItem('userEmail')) { localStorage.removeItem('userFirstName'); localStorage.removeItem('userLastName'); } localStorage.setItem('userEmail', email); const role = document.querySelector('input[name=\'role\']:checked').id; if(role === 'roleAdmin') { window.location.href='admin-dashboard.html'; } else { window.location.href='client-dashboard.html'; }">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Email Address</label>
                        <input type="email" class="form-control form-control-stackly" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">Password</label>
                        <input type="password" class="form-control form-control-stackly" required>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small text-secondary" for="rememberMe">Remember Me</label>
                        </div>
                        <a href="404.html" class="small text-primary fw-bold text-decoration-none">Forgot Password?</a>
                    </div>
                    
                    <button class="btn btn-primary-stackly w-100 justify-content-center mb-3" type="submit">Login</button>
                    
                    <div class="position-relative text-center my-4">
                        <hr class="text-secondary opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-secondary">Or continue with</span>
                    </div>
                    
                    <div class="d-flex gap-3 mb-4">
                        <a href="404.html" class="btn btn-outline-secondary w-50 d-flex justify-content-center align-items-center gap-2 py-2 text-decoration-none">
                            <i class="bi bi-google"></i> Google
                        </a>
                        <a href="404.html" class="btn btn-outline-secondary w-50 d-flex justify-content-center align-items-center gap-2 py-2 text-decoration-none">
                            <i class="bi bi-apple fs-5"></i> Apple
                        </a>
                    </div>
                    
                    <p class="text-center small text-secondary mt-4">
                        Don't have an account? <a href="signup.html" class="text-primary fw-bold text-decoration-none">Sign Up</a>
                    </p>
                    <div class="text-center mt-4 pt-2">
                        <a href="index.html" class="btn btn-outline-secondary rounded-pill fw-bold px-4 py-2"><i class="bi bi-arrow-left me-1"></i> Go to Home</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/forms.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedRole = localStorage.getItem('userRole');
            if (savedRole === 'admin') {
                document.getElementById('roleAdmin').checked = true;
            } else if (savedRole === 'client') {
                document.getElementById('roleClient').checked = true;
            }
        });
    </script>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const preloader = document.getElementById('preloader');
                if (preloader) {
                    preloader.classList.add('hidden');
                    setTimeout(() => { preloader.remove(); }, 500);
                }
            }, 2000);
        });
    </script>
</body>
</html>
